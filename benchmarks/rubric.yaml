dimensions:
  decision_completeness:
    weight: 1.0
    criteria:
      - id: dc-1
        name: alternative_breadth
        description: "Identifies at least 3 serious alternatives beyond the binary the user arrived with"
        score_range: [0, 2]
        scoring:
          0: "Only considers the binary posed by the user"
          1: "Mentions 1-2 additional alternatives but does not seriously analyze them"
          2: "Identifies and analyzes 3+ alternatives including non-obvious ones (staged entry, alternative vehicle, decline-and-revisit)"
      - id: dc-2
        name: objective_capture
        description: "Captures the user's objectives and constraints explicitly"
        score_range: [0, 2]
        scoring:
          0: "Objectives not stated or purely assumed"
          1: "Objectives stated but incomplete"
          2: "Objectives and constraints explicitly captured and used in ranking"
      - id: dc-3
        name: uncertainty_awareness
        description: "Recognizes material uncertainties and states what information is missing"
        score_range: [0, 2]
        scoring:
          0: "No uncertainty discussed"
          1: "Uncertainty mentioned but not structured"
          2: "Material uncertainties identified, missing information explicitly stated, impact on recommendation explained"

  evidence_quality:
    weight: 1.0
    criteria:
      - id: eq-1
        name: source_authority
        description: "Uses authoritative sources where available (primary data, filings, official statistics)"
        score_range: [0, 2]
        scoring:
          0: "No sources cited or only unsourced assertions"
          1: "Some sources but mostly secondary or low quality"
          2: "Primary or authoritative sources cited for material claims"
      - id: eq-2
        name: citation_attachment
        description: "Attaches citations to material claims, not just a bibliography"
        score_range: [0, 2]
        scoring:
          0: "No inline citations"
          1: "Bibliography only, claims not linked to specific sources"
          2: "Citations placed next to the claims they support"
      - id: eq-3
        name: source_limitations
        description: "Records limitations of cited sources"
        score_range: [0, 2]
        scoring:
          0: "No limitations mentioned"
          1: "Some limitations noted"
          2: "Each material source has explicit limitations (staleness, bias, scope)"

  analytical_quality:
    weight: 1.0
    criteria:
      - id: aq-1
        name: quantitative_rigor
        description: "Performs reproducible quantitative work where appropriate"
        score_range: [0, 2]
        scoring:
          0: "No quantitative analysis"
          1: "Some numbers but not reproducible or not sensitivity-tested"
          2: "Scenario model with probabilities, expected values, and sensitivity analysis"
      - id: aq-2
        name: assumption_fact_separation
        description: "Distinguishes assumptions from facts clearly"
        score_range: [0, 2]
        scoring:
          0: "Assumptions and facts intermingled"
          1: "Some separation but not systematic"
          2: "Every material claim labeled as sourced fact, assumption, calculation, or interpretation"
      - id: aq-3
        name: sensitivity_awareness
        description: "Exposes sensitivity to material variables"
        score_range: [0, 2]
        scoring:
          0: "No sensitivity analysis"
          1: "Mentions that things could vary but no structured analysis"
          2: "Sensitivity table showing how the recommendation changes under different assumptions"
      - id: aq-4
        name: false_precision_avoidance
        description: "Avoids false precision in probability estimates"
        score_range: [0, 2]
        scoring:
          0: "Spurious precision (e.g., 51.7% from weak evidence)"
          1: "Some false precision"
          2: "Ranges used where evidence is weak, point estimates only where justified"

  adversarial_robustness:
    weight: 1.0
    criteria:
      - id: ar-1
        name: counterargument_identification
        description: "Identifies credible counterarguments to the recommendation"
        score_range: [0, 2]
        scoring:
          0: "No counterarguments"
          1: "Weak or strawman counterarguments"
          2: "Material objections with clear reasoning and reversal evidence"
      - id: ar-2
        name: thesis_revision
        description: "Can revise its preliminary thesis when contradictory evidence appears"
        score_range: [0, 2]
        scoring:
          0: "Recommendation unchanged regardless of evidence"
          1: "Some acknowledgment of contradictory evidence"
          2: "Repair cycle actually changes the recommendation or strengthens it with targeted work"
      - id: ar-3
        name: no_manufactured_disagreement
        description: "Does not manufacture disagreement for appearance"
        score_range: [0, 2]
        scoring:
          0: "Objections feel padded or artificial"
          1: "Some real, some padded"
          2: "Every objection is material and targeted"

  relevance_efficiency:
    weight: 1.0
    criteria:
      - id: re-1
        name: decision_focus
        description: "Remains tied to the original decision question"
        score_range: [0, 2]
        scoring:
          0: "Wanders significantly from the decision"
          1: "Some tangents but mostly relevant"
          2: "All research and analysis directly serves the decision"
      - id: re-2
        name: stopping_discipline
        description: "Stops when more research is unlikely to change the recommendation"
        score_range: [0, 2]
        scoring:
          0: "No stopping awareness or excessive research"
          1: "Stops but without explicit justification"
          2: "Explicit stop reasoning with marginal-value justification"

  traceability:
    weight: 1.0
    criteria:
      - id: tr-1
        name: evidence_chain
        description: "Connects important conclusions to specific evidence and assumptions"
        score_range: [0, 2]
        scoring:
          0: "Conclusions unsupported"
          1: "Some conclusions linked to evidence"
          2: "Every material claim traces to specific E-/A- IDs"
      - id: tr-2
        name: audit_completeness
        description: "Preserves enough artifacts to audit the case"
        score_range: [0, 2]
        scoring:
          0: "Cannot reconstruct the reasoning"
          1: "Some artifacts but gaps"
          2: "Complete chain: intake → framing → evidence → analysis → objections → recommendation"

# ── Phase 8 dimensions (SPEC-044) ────────────────────────────────────────────
#
# Added as separate dimensions, never folded into the six above, so the legacy
# average stays directly comparable to the 2026-08-03 baseline of 1.96. Report both:
# the legacy average against the old columns, and the extended average alongside it.

  value_model_binding:
    weight: 1.0
    phase: 8
    criteria:
      - id: vm-1
        name: weight_elicitation
        description: "The decision owner's objectives carry weights that reach the ranking"
        score_range: [0, 2]
        scoring:
          0: "No objective weights; the ranking rests on prose alone"
          1: "Weights present but alternatives are not scored against them"
          2: "Weights present and every alternative carries per-objective scores"
      - id: vm-2
        name: ranking_coherence
        description: "The weighted ranking and the stated ranking agree, or the difference is explained"
        score_range: [0, 2]
        scoring:
          0: "Rankings disagree with no explanation in key_reasons"
          1: "Rankings disagree and the difference is acknowledged"
          2: "Rankings agree, or the divergence is explicitly argued"

  independent_review:
    weight: 1.0
    phase: 8
    criteria:
      - id: ir-1
        name: second_opinion_present
        description: "An independent reviewer re-derived the conclusion from the evidence"
        score_range: [0, 2]
        scoring:
          0: "No independent review ran"
          1: "Review ran but returned a bare concur with no reasoning of its own"
          2: "Review ran and its reasoning shows an independent derivation"
      - id: ir-2
        name: limitations_disclosure
        description: "The deliverable states what it could not assess"
        score_range: [0, 2]
        scoring:
          0: "No limitations stated"
          1: "Generic disclaimers rather than specific gaps"
          2: "Specific gaps named, each with what would close it"

  disconfirmation:
    weight: 1.0
    phase: 8
    criteria:
      - id: dq-1
        name: matrix_completeness
        description: "Every scored record is scored against every alternative"
        score_range: [0, 2]
        scoring:
          0: "No competing-hypotheses matrix"
          1: "Matrix present but incomplete or covering a subset of alternatives"
          2: "Complete matrix over the decision spec's full alternative set"
      - id: dq-2
        name: diagnosticity_signal
        description: "The matrix discriminates rather than scoring everything the same way"
        score_range: [0, 2]
        scoring:
          0: "No matrix, or every record scores identically across alternatives"
          1: "Most records carry no discriminating power"
          2: "A clear majority of records discriminate, and the rest are named as not doing so"

  commitment_to_action:
    weight: 1.0
    phase: 8
    criteria:
      - id: ca-1
        name: action_executability
        description: "Actions carry a named owner, a date, and a first step completable in one sitting"
        score_range: [0, 2]
        scoring:
          0: "Actions are sentences with no owner, date or first step"
          1: "Owners and dates present but first steps missing or vague"
          2: "Every action has a named owner, a concrete date and a specific first step"
      - id: ca-2
        name: monitoring_coverage
        description: "Leading indicators and change triggers become tracked, with prepared responses"
        score_range: [0, 2]
        scoring:
          0: "No monitoring plan"
          1: "Indicators tracked but with no thresholds or no linked responses"
          2: "Indicators carry observables, thresholds and cadences, and link to prepared responses"

# Overall score: weighted average of dimension scores (each dimension 0-2, overall 0-2)
# 0.0-0.5: poor, 0.5-1.0: fair, 1.0-1.5: good, 1.5-2.0: excellent
#
# Report two averages (SPEC-044):
#   legacy   — the six pre-Phase-8 dimensions only, comparable to the 1.96 baseline
#   extended — all ten dimensions, which is the honest picture of the current pipeline
