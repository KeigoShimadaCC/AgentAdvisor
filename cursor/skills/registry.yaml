# Domain specialist skill packs (north star 6.7).
#
# A pack is plain markdown appended to the role instructions inside an isolated
# workspace. The orchestrator selects packs by keyword score; the agent never
# chooses its own pack and never spawns a specialist.
#
# `roles` lists the roles a pack is allowed to reach. Verification and review roles
# are deliberately excluded so domain framing cannot bias the check on the work.

packs:
  - id: public-equity
    title: Public equity and listed-security investing
    path: cursor/skills/public-equity/SKILL.md
    roles: [researcher, analyst, director, structurer, premortem, assumption_analyst]
    keywords:
      - stock
      - stocks
      - equity
      - equities
      - etf
      - index
      - shares
      - ticker
      - nasdaq
      - valuation
      - earnings
      - dividend
      - portfolio
      - brokerage
      - semiconductor
      - nvidia

