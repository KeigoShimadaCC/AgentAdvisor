role_md_path: cursor/roles/analyst.md
default_model: composer-2.5
escalation_model: cursor-grok-4.5-low
read_only: false
allow_shell: true
projection_include:
  - decision_spec
  - task_records
  - key_evidence
  - assumptions
# Analyst additionally receives analysis/<task-id>/ as a writable working area.
output_artifact_type: analysis_result
model_tier: medium
