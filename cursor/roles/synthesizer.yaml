role_md_path: cursor/roles/synthesizer.md
default_model: composer-2.5
escalation_model: cursor-grok-4.5-low
read_only: false
allow_shell: false
projection_include:
  - ach_matrix
  - decision_spec
  # artifact_index is a compact, authoritative list of every real E-/A-/O- ID
  # with a one-line summary. It is placed early so it survives the projection
  # char budget even when full evidence records are truncated, giving the
  # synthesizer the true ID set to cite instead of inventing IDs (e.g. E-801).
  - artifact_index
  - evidence_records
  - assumptions
  - objections
  - analysis_result
  - disclosure_record
  - preliminary_recommendation
  - premortem_report
  - track_divergence
  - evidence_critique
  - review_report
output_artifact_type: final_recommendation
model_tier: high
