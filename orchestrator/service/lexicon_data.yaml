# SPEC-033 — Presentation lexicon v1
#
# The single source for UI narration of audit events.  Each entry is keyed by
# the audit ``event_type``.  Fields:
#
#   template:   a Python str.format template filled from the event payload.
#               Slot names must match payload keys or built-in context vars:
#                 {actor}      — the event actor (e.g. "researcher")
#                 {event_type} — the raw event type (always available)
#               Unavailable slots are replaced with "—" rather than raising.
#   technical:  true for Method-only events (retry/coercion noise).  The UI
#               hides these unless the Method room is open.
#
# Unknown event types are flagged ``technical: true`` and rendered with a
# generic "raw event" message that does NOT leak the raw JSON — the raw
# payload is sent separately under ``raw_payload`` for the Method room.

budget_profile_selected:
  template: "Budget profile selected: {profile}"
  technical: true

role_invocation_started:
  template: "{actor} started work on task {task_id}"
  technical: false

role_invocation_progress:
  template: "{actor} is still working on task {task_id} ({elapsed_s}s)"
  technical: false

role_invocation_attempt:
  template: "{actor} — attempt {attempt}: {status}"
  technical: false

stage_completed:
  template: "Completed stage: {stage}"
  technical: false

task_started:
  template: "Task {task_id} started"
  technical: false

task_completed:
  template: "Task {task_id} completed"
  technical: false

stage_gate_evaluated:
  template: "Gate {stage}: {outcome}"
  technical: false

thesis_revision_recorded:
  template: "Thesis revision {revision}: {preferred_alternative}"
  technical: false

evidence_batch_unpacked:
  template: "{record_count} evidence record(s) gathered for task {task_id}"
  technical: false

objection_batch_unpacked:
  template: "Objections unpacked"
  technical: false

assumption_batch_unpacked:
  template: "{record_count} assumption(s) added to the ledger"
  technical: false

review_evaluated:
  template: "Review: {outcome}"
  technical: false

stop_decision_evaluated:
  template: "Stop decision: {outcome}"
  technical: false

dual_track_compared:
  template: "Dual-track divergence compared"
  technical: false

case_recorded_to_memory:
  template: "Case recorded to institutional memory"
  technical: true

case_finalized:
  template: "Case finalized"
  technical: false

control_case_created:
  template: "Case created"
  technical: true

control_run_started:
  template: "Run started"
  technical: true

control_run_stopped:
  template: "Run stopped"
  technical: true

control_checkpoint_signed:
  template: "Checkpoint signed: {gate}"
  technical: false

control_resume_reconciled:
  template: "Resume reconciled orphaned tasks"
  technical: true

framing_revision_requested:
  template: "Framing revision requested"
  technical: false

final_revision_requested:
  template: "Final revision requested"
  technical: false

# Refusals, failures and cancellations. These are user-facing on purpose: a run
# that investigated less than it could have must say so while it is happening,
# not only in the final disclosure block.

task_failed:
  template: "Task {task_id} failed: {error}"
  technical: false

task_budget_refused:
  template: "Task {task_id} was not started — the invocation budget is exhausted"
  technical: false

task_marginal_value_refused:
  template: "Task {task_id} was skipped — its expected value ({expected_marginal_value}) did not justify its cost ({estimated_cost})"
  technical: false

tasks_cancelled:
  template: "Cancelled {task_ids}: {reason}"
  technical: false

# Bookkeeping. Real events, but they describe the machinery rather than the
# investigation, so they stay in the Method room.

case_memory_write_failed:
  template: "Could not write this case to cross-case memory: {error}"
  technical: true

prepare_resume:
  template: "Prepared resume (reset tasks: {reset_task_ids})"
  technical: true

task_reset_on_resume:
  template: "Reset orphaned tasks on resume: {task_ids}"
  technical: true

thesis_revision_skipped_duplicate:
  template: "Thesis unchanged after {trigger} — no revision recorded"
  technical: true

unpack_skipped_duplicate:
  template: "Skipped duplicate {artifact_type} for task {task_id}"
  technical: true

render_skipped:
  template: "Recommendation render skipped (citation issue) — case continues"
  technical: false
