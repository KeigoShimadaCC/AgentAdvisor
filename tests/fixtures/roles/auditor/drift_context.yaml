    objection_id: O-001
    target_section: preliminary_recommendation.rationale[0]
    claim: Recommendation may be brittle under dilution stress.
    materiality: high
    reasoning: No completed sensitivity artifact yet.
    reversal_evidence: A completed dilution sensitivity table showing the ranking
      holds across the modelled range.
    resolution_status: open
    commissioned_tasks: [T-102]

