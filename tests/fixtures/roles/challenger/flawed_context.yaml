decision_spec:
  schema_version: 1
  decision_id: case-001-challenger
  question: Should the user invest in AAA now or wait for evidence of pricing durability?
  owner: user
  deadline: "2026-11-30"
  alternatives:
    - invest_now
    - invest_in_stages
    - wait_for_pricing_data
    - decline_for_now
  objectives:
    - maximize risk-adjusted return
    - avoid irreversible downside
  constraints:
    - keep emergency runway intact
  risk_tolerance: moderate
  reversibility: partially_reversible
  depth: standard

