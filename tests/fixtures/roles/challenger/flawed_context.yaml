    retrieved_by: researcher

prior_resolved_objections:
  - schema_version: 1
    objection_id: O-210
    target_section: preliminary_recommendation.rationale[0]
    claim: Earlier thesis ignored downside dilution.
    materiality: high
    reasoning: Repair cycle added downside-case dilution analysis.
    reversal_evidence: Direct evidence that downside dilution was already fully modeled in the prior thesis.
    referenced_evidence_ids: []
    referenced_assumption_ids: []
    resolution_status: resolved
    commissioned_tasks:
      - T-212

preliminary_recommendation:
  schema_version: 1
  preferred_alternative: invest_now
  rationale:
    - Current traction supports immediate entry at full size.
    - We can assume churn stays below 2 percent after the planned 35 percent price increase even without direct external evidence.
  key_assumptions:
    - A-301
  outcome_probabilities:
    positive_return_within_5y:
      schema_version: 1
      method: structured_subjective
      point: 0.82
      reference_class: null
      base_rate: null
      interval_low: null
      interval_high: null
      adjustments: []
  evidence_confidence:
    schema_version: 1
    value: 0.63
    basis: Evidence quality is mixed and partly self-reported.
  recommendation_confidence:
    schema_version: 1
    value: 0.91
    basis: High conviction due to projected growth persistence.
  model_stability:
    schema_version: 1
    share_of_sensitivity_runs_supporting_recommendation: 1.0
    runs_total: 10
    runs_supporting: 10
  unresolved_evidence_gaps:
