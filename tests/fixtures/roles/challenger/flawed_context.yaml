    evidence_id: E-301
    claim: AAA reported stronger expansion revenue in the latest internal update.
    source_title: AAA board update Q3 2026
    publisher: AAA
    source_url: https://example.com/aaa-q3-board-update
    source_type: original_research
    publication_date: "2026-09-20"
    retrieval_date: "2026-10-01"
    excerpt: Expansion ARR grew 24 percent quarter-over-quarter.
    reliability: medium
    directness: medium
