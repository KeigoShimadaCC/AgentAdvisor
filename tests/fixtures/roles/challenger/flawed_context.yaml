    assumption_id: A-301
    claim: Customer churn remains below 2 percent after a 35 percent price increase.
    type: forecast
    estimate:
      schema_version: 1
      method: structured_subjective
      point: 0.8
      reference_class: null
      base_rate: null
      interval_low: null
      interval_high: null
      adjustments: []
    confidence: low
    materiality: high
    evidence_for:
      - E-301
    evidence_against: []
    status: unresolved

evidence:
