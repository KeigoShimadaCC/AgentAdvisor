      role: researcher
      question: What is the reference-class base rate of loss-making outcomes for comparable
        pre-IPO software investments over five years?
      why_it_matters: Base rates can materially change downside probability and may reverse
        invest_now versus wait_for_milestone.
      expected_information_gain: high
      materiality: high
      probability_of_changing_conclusion: 0.72
      estimated_cost: 1.1
      inputs:
        - decision_spec
        - open_assumptions
      required_output: evidence_records with cited base-rate candidates and source independence
        groups.
      completion_criteria: At least three independent reference-class estimates with date,
        definition notes, and one contradictory source.
      priority: high
      priority_score: 92
      priority_rationale: Directly updates high-materiality probability assumptions.
